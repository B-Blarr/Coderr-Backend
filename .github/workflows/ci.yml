name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the server. Quoted because YAML reads 3.10 as 3.1.
          python-version: "3.12"
          cache: pip
          # requirements-dev.txt pulls in requirements.txt via -r, but the
          # cache key only hashes the files listed here. Both are named so a
          # change to either one refreshes the cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8

      # !cancelled() keeps the remaining checks running after an earlier
      # failure, so one push reports every problem instead of only the first.
      - name: Check import order
        if: '!cancelled()'
        run: isort --check-only --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest

    # PostgreSQL 16 matches the server. Locally the suite runs on SQLite,
    # so this is where it meets the production database engine.
    services:
      db:
        image: postgres:16
        # Throwaway credentials: the container exists only for this run and
        # cannot be reached from outside the runner.
        env:
          POSTGRES_DB: coderr
          POSTGRES_USER: coderr
          POSTGRES_PASSWORD: coderr
        ports:
          - 5432:5432
        # Without the health check the tests can start before PostgreSQL
        # accepts connections, which fails the run for no real reason.
        options: >-
          --health-cmd "pg_isready -U coderr -d coderr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A set DB_NAME switches settings.py from SQLite to PostgreSQL.
      DB_NAME: coderr
      DB_USER: coderr
      DB_PASSWORD: coderr
      DB_HOST: localhost
      DB_PORT: 5432
      # Throwaway value for the test run. Not a secret, used nowhere else.
      SECRET_KEY: ci-only-key-not-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --check fails on a missing migration, --dry-run writes nothing.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        if: '!cancelled()'
        run: coverage run --source=. --omit="*/tests/*,*/migrations/*" manage.py test

      # Reported for information. A drop in coverage does not fail the build.
      - name: Coverage report
        run: coverage report

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10

    # Pull requests run the checks above, but never deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Two merges in quick succession must never deploy at the same time.
    # A later run waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      # ssh refuses a private key file that others can read, hence chmod 600.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The script is never copied to the server: bash reads it from stdin.
      # github.sha is exactly the commit the checks above have tested.
      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash -s -- ${{ github.sha }}" < deploy/deploy.sh

      # A 200 alone proves little. The content type shows that the right
      # kind of file came back: JSON from Django, CSS from collectstatic.
      - name: Verify site
        run: |
          check() {
            result=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$1")
            echo "$1 -> $result"
            case "$result" in
              "200 $2"*) ;;
              *) echo "Expected 200 $2" >&2; exit 1 ;;
            esac
          }
          check https://coderr.benjaminblarr.de/api/base-info/ application/json
          check https://coderr.benjaminblarr.de/static/admin/css/base.css text/css
