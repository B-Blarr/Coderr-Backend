# ---------------------------------------------------------------------
# For locations that pass the request on to Django, installed as
# /etc/nginx/snippets/security-headers-upstream.conf.
#
# Django sends these four headers itself. Together with the set from
# security-headers.conf each of them would arrive twice, and two
# different X-Frame-Options values contradict each other. Nginx drops
# the copies from Django and sends its own set.
# ---------------------------------------------------------------------

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
