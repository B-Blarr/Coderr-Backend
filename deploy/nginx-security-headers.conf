# ---------------------------------------------------------------------
# Security headers for every response Nginx sends, installed as
# /etc/nginx/snippets/security-headers.conf and included in each server
# block for port 443.
#
# add_header is only inherited by a location that sets no add_header of
# its own. Every location with its own Cache-Control therefore includes
# this file again. "always" also covers error pages such as 403 and 404.
#
# No includeSubDomains and no preload on purpose: both are hard to take
# back. SAMEORIGIN instead of DENY, so a page of this site may still be
# framed by this site. No Content-Security-Policy here: Angular inlines
# critical CSS, a strict policy would break the page.
# ---------------------------------------------------------------------

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
