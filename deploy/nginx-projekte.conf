# ---------------------------------------------------------------------
# Coderr liegt seit dem 29.07.2026 auf einer eigenen Subdomain.
# Die alten Adressen bleiben dauerhaft gueltig, damit bereits
# verschickte Links weiter funktionieren.
# ---------------------------------------------------------------------

location = /coderr {
    return 301 https://coderr.benjaminblarr.de/;
}

location /coderr/ {
    rewrite ^/coderr/(.*)$ https://coderr.benjaminblarr.de/$1 permanent;
}

# ---------------------------------------------------------------------
# Statische Projekte. Die exakten Treffer fangen Adressen ohne
# abschliessenden Schraegstrich ab, sonst greift der SPA-Rueckfall
# des Portfolios und liefert die Startseite aus.
# ---------------------------------------------------------------------

location = /join          { return 301 /join/; }
location = /pokedex       { return 301 /pokedex/; }
location = /el-pollo-loco { return 301 /el-pollo-loco/; }
location = /bestellapp    { return 301 /bestellapp/; }
location = /bookstore     { return 301 /bookstore/; }
location = /cardelia      { return 301 /cardelia/; }
location /el-pollo-loco/ {
    alias /var/www/el-pollo-loco/;
    index index.html;
    try_files $uri $uri/ =404;

    # No content hash in any file name, so nothing may be cached forever: a
    # replaced sprite must not stay visible for months. One hour spares the
    # browser 74 revalidations per visit and still lets a fix reach players
    # the same day.
    add_header Cache-Control "public, max-age=3600";
}

location /pokedex/ {
    alias /var/www/pokedex/;
    index index.html;
    try_files $uri $uri/ =404;
}

location /bestellapp/ {
    alias /var/www/bestellapp/;
    index index.html;
    try_files $uri $uri/ =404;
}

location /bookstore/ {
    alias /var/www/bookstore/;
    index index.html;
    try_files $uri $uri/ =404;
}

# ---------------------------------------------------------------------
# Cardelia, Architekturseite zum gleichnamigen Projekt. Eine statische
# Seite plus fuenf Bilder, keine Angular-App und keine Hashes in den
# Dateinamen.
# ---------------------------------------------------------------------

location /cardelia/ {
    alias /var/www/cardelia/;
    index index.html;
    try_files $uri $uri/ =404;

    # Wie bei El Pollo Loco: ohne Hash im Dateinamen darf nichts ewig
    # zwischengespeichert werden. Eine korrigierte Beschriftung im
    # Diagramm muss am selben Tag ankommen.
    add_header Cache-Control "public, max-age=3600";
}
# ---------------------------------------------------------------------
# Join. Angular writes a content hash into the bundle and media file
# names, so those may be kept forever. index.html is what names them and
# must therefore never be cached.
# ---------------------------------------------------------------------

# Anchored to /join/ on purpose: a regex location outranks every prefix
# location, and [^/]* cannot cross a slash, so subdirectories stay out.
# root instead of alias, because an alias inside a regex location would
# need capture groups: /join/main-<hash>.js under /var/www already
# resolves to /var/www/join/main-<hash>.js.
location ~* "^/join/[^/]*-[A-Z0-9]{8,}\.(?:js|css)$" {
    root /var/www;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Everything Angular emits into media/ carries a hash as well. The alias
# is repeated here because alias is not inherited by another location.
location /join/media/ {
    alias /var/www/join/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# A stale index.html would point at files the last deployment deleted,
# and try_files would answer with index.html instead of JavaScript.
# no-cache does not forbid storing it, it forces a revalidation before
# every use, which the ETag settles with a small 304.
location = /join/index.html {
    alias /var/www/join/index.html;
    add_header Cache-Control "no-cache";
}

location /join/ {
    alias /var/www/join/;
    index index.html;
    try_files $uri $uri/ /join/index.html;

    # assets/ keeps its file names across builds, so an hour instead of a
    # year: a replaced icon must not stay visible for months.
    add_header Cache-Control "public, max-age=3600";
}

# ---------------------------------------------------------------------
# Kontaktformular des Portfolios, beantwortet von Django.
# ---------------------------------------------------------------------

location /api/contact {
    proxy_pass http://unix:/run/gunicorn/coderr.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
