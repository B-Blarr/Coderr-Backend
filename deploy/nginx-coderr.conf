server {
    server_name coderr.benjaminblarr.de;

    root /var/www/coderr/frontend;
    index index.html;

    client_max_body_size 10M;

    # ---------- Security ----------
    # Sent with every response of this server. A location that sets its own
    # add_header drops everything inherited from here, so each of those
    # locations includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # Hidden files and folders such as .git or .env are never served.
    # /.well-known/ stays reachable for the Let's Encrypt challenge.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/coderr.access.log;
    error_log  /var/log/nginx/coderr.error.log;

    # The portfolio assistant belongs to benjaminblarr.de, not to the
    # Coderr API. A single entry point keeps one timeout and one log.
    location /api/assistant {
        return 404;
    }

    # Django sends its own security headers. Nginx hides them here and sends
    # the set from above instead, so no header arrives twice.
    location /api/ {
        include /etc/nginx/snippets/security-headers-upstream.conf;
        proxy_pass http://unix:/run/gunicorn/coderr.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        include /etc/nginx/snippets/security-headers-upstream.conf;
        proxy_pass http://unix:/run/gunicorn/coderr.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /var/www/coderr/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/coderr/backend/media/;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coderr.benjaminblarr.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coderr.benjaminblarr.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = coderr.benjaminblarr.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name coderr.benjaminblarr.de;
    return 404; # managed by Certbot


}