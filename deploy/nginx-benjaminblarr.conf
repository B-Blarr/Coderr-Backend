server {
    server_name benjaminblarr.de www.benjaminblarr.de;

    root /var/www/portfolio;
    index index.html;

    # Uploads: Django-Profilbilder brauchen mehr als die 1 MB Standard
    client_max_body_size 10M;

    include /etc/nginx/snippets/projekte.conf;

    access_log /var/log/nginx/benjaminblarr.access.log;
    error_log  /var/log/nginx/benjaminblarr.error.log;

    # ---------- Caching ----------
    # index.html names the hashed bundles below. A stale copy would point at
    # a file the last deployment deleted, and try_files would answer with
    # index.html instead of JavaScript. no-cache does not forbid storing it,
    # it forces a revalidation before every use, which the ETag settles with
    # a small 304.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The content hash sits in the file name, so these never change under an
    # existing name and may be kept forever. Anchored to the root on purpose:
    # a regex location outranks every prefix location, and without the anchor
    # this would also swallow /join/main-<hash>.js and take it away from the
    # alias block that serves it.
    location ~* "^/[^/]*-[A-Z0-9]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- Portfolio ----------
    location / {
        # Icons, images, fonts and i18n carry no hash in their names, so they
        # get an hour instead of a year: a replaced image must not stay
        # visible for months.
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/benjaminblarr.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/benjaminblarr.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.benjaminblarr.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = benjaminblarr.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name benjaminblarr.de www.benjaminblarr.de;
    return 404; # managed by Certbot
}
